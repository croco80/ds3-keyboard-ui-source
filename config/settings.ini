[UI]
; 0 = ordinary 16:9 display (default)
; 1 = enable the optional 16:10 interface-position fix
Enable16x10=0

[Resolution]
; Leave every line at 0 for keyboard-only mode.
; For a 16:10 display, set EXACTLY ONE resolution below to 1.
; The selected mode applies the runtime black-bar fix and refreshes
; AppData\Roaming\DarkSoulsIII\GraphicsConfig.xml at every game launch.
Enable1280x800=0
Enable1440x900=0
Enable1680x1050=0
Enable1920x1200=0
Enable2560x1600=0
Enable2880x1800=0
Enable3840x2400=0
